<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CSWA Certificate | Tawfiq Mahumud Khan</title>
  <meta name="description"
        content="SolidWorks CSWA (CAD Design Associate) certificate awarded to Tawfiq Mahumud Khan, April 16 2025." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%234f8bff'/><text x='16' y='22' font-family='Inter,sans-serif' font-size='16' font-weight='700' text-anchor='middle' fill='white'>T</text></svg>" />

  <style>
    /* Page-specific styles — kept inline so certificate.html stays a
       standalone artifact independent of the rest of the site. */
    html, body { height: 100%; margin: 0; }
    body { background: #0f1623; color: #fff; font-family: Inter, system-ui, sans-serif; }
    .cert-viewer {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }
    .cert-toolbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 22px;
      background: rgba(15, 22, 35, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      flex: 0 0 auto;
    }
    .cert-toolbar h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #fff;
      flex: 1 1 auto;
      min-width: 0;
    }
    .cert-toolbar h1 small {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.55);
      margin-top: 2px;
    }
    .cert-toolbar a {
      color: #cfe0ff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }
    .cert-toolbar a:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.25);
      color: #fff;
    }
    .cert-frame {
      flex: 1 1 auto;
      min-height: 0;
      background: #2a3142;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }
    .cert-frame object,
    .cert-frame embed,
    .cert-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
    .cert-fallback {
      margin: auto;
      max-width: 520px;
      padding: 28px 32px;
      text-align: center;
      color: rgba(255, 255, 255, 0.85);
    }
    .cert-fallback h2 {
      margin: 0 0 12px;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
    }
    .cert-fallback p {
      margin: 0 0 22px;
      font-size: 14px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.7);
    }
    .cert-fallback a.btn {
      display: inline-block;
      padding: 10px 18px;
      background: #4f8bff;
      color: #fff;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }

    /* ---------- Responsive (phones) ----------
       On phones the toolbar's h1 + 2 pill buttons would overflow, so we
       drop the buttons to a second row and shrink padding/typography. */
    @media (max-width: 560px) {
      .cert-toolbar {
        flex-wrap: wrap;
        gap: 10px;
        padding: 12px 16px;
      }
      .cert-toolbar h1 {
        font-size: 14px;
        flex: 1 1 100%;
        margin-bottom: 2px;
      }
      .cert-toolbar h1 small {
        font-size: 11px;
      }
      .cert-toolbar a {
        padding: 6px 12px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="cert-viewer">
    <header class="cert-toolbar">
      <h1>
        SolidWorks CSWA | Certificate of Completion
        <small>Issued April 16 2025 · Certificate ID C-2L5NGV7WMU</small>
      </h1>
      <a href="certificate/Certificate_C-2L5NGV7WMU.pdf" download>Download PDF</a>
      <a href="index.html">&larr; Back to portfolio</a>
    </header>

    <main class="cert-frame">
      <!-- <object> renders the PDF inline with a built-in toolbar in
           modern browsers, and falls back to its child content when the
           browser cannot render PDFs (rare, but worth covering). -->
      <object data="certificate/Certificate_C-2L5NGV7WMU.pdf"
              type="application/pdf"
              aria-label="CSWA certificate PDF">
        <div class="cert-fallback">
          <h2>Your browser can&rsquo;t display the PDF inline.</h2>
          <p>You can still download the certificate and open it locally.</p>
          <a class="btn" href="certificate/Certificate_C-2L5NGV7WMU.pdf" download>Download PDF</a>
        </div>
      </object>
    </main>
  </div>

</body>
</html>
